# Локальное окружение: Kafka + Go-коллектор (2). Запуск из корня репозитория:
#   docker compose -f tools/docker-compose.yaml up --build
#
# Требует заполненный collector/.env (TINKOFF_TOKEN, ADMIN_API_KEY) — см.
# collector/.env.example.

services:
  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    container_name: charthawk-kafka
    ports:
      - "9092:9092" # доступ с хоста (для локальных консьюмеров/отладки)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 19092 — внутренний листенер для сервисов сети (Collector, Analyzer...),
      # 9092 — листенер для доступа с хост-машины.
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - charthawk
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: charthawk-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: charthawk
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8080:8080" # веб-интерфейс: топики, сообщения, консьюмер-группы, lag
    networks:
      - charthawk
    restart: unless-stopped

  collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    container_name: charthawk-collector
    command: ["-config", "/config.yaml"]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ../collector/.env
    volumes:
      - ../collector/config.docker.yaml:/config.yaml:ro
    ports:
      - "8081:8081" # REST API управления подписками + /metrics
    networks:
      - charthawk
    restart: unless-stopped

networks:
  charthawk:
    driver: bridge

volumes:
  kafka-data:
